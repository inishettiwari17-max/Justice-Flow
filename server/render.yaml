services:
  - type: web
    name: justice-flow
    runtime: node
    region: singapore   # closest to India
    plan: free
    rootDir: .          # server folder is the root when deploying just the backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these in the Render dashboard — never hardcode secrets here:
      # MONGO_URI  → your Atlas connection string
      # JWT_SECRET → your secret key
      # CLIENT_URL → your frontend URL
