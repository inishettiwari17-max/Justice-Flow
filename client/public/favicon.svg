<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a3c6e"/>
  
  <!-- Scale of Justice -->
  <!-- Central pillar -->
  <rect x="30" y="18" width="4" height="28" fill="#c9a84c"/>
  
  <!-- Base -->
  <rect x="24" y="44" width="16" height="3" rx="1.5" fill="#c9a84c"/>
  
  <!-- Horizontal bar -->
  <rect x="14" y="20" width="36" height="2.5" rx="1.25" fill="#c9a84c"/>
  
  <!-- Left scale pan -->
  <path d="M 12,24 L 8,30 L 16,30 Z" fill="#c9a84c"/>
  <line x1="12" y1="22" x2="12" y2="24" stroke="#c9a84c" stroke-width="1.5"/>
  
  <!-- Right scale pan -->
  <path d="M 52,24 L 48,30 L 56,30 Z" fill="#c9a84c"/>
  <line x1="52" y1="22" x2="52" y2="24" stroke="#c9a84c" stroke-width="1.5"/>
  
  <!-- Chains -->
  <line x1="12" y1="22" x2="14" y2="20.5" stroke="#c9a84c" stroke-width="1"/>
  <line x1="52" y1="22" x2="50" y2="20.5" stroke="#c9a84c" stroke-width="1"/>
  
  <!-- Accent circle at top -->
  <circle cx="32" cy="18" r="2.5" fill="#c9a84c"/>
</svg>
